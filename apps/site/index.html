<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A headless-core React data table where every feature works on the client and on the server."
    />
    <title>React Tablekit</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the stored site theme before first paint to avoid a flash. The browser chrome
      // (theme-color) follows it, so a dark page does not sit under a white address bar.
      try {
        var t = localStorage.getItem('tk-site:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.siteTheme = t;
        if (t === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1220');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

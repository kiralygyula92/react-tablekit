<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="react-tablekit: a headless-core React data table with client and server modes, slots, handler middleware and CSS-variable theming."
    />
    <title>react-tablekit</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232196F3'/%3E%3Cpath d='M3 5h10M3 8h10M3 11h10' stroke='white' stroke-width='1.2'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored site theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tk-site:theme');
        if (t === 'light' || t === 'dark' || t === 'classic')
          document.documentElement.dataset.siteTheme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

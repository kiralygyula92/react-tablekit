packages:
  - packages/*
  - apps/*

# Patched transitive versions while upstream ranges still select vulnerable releases.
overrides:
  'esbuild@>=0.27.3 <0.28.1': 0.28.2
  'remark-mdx-frontmatter>toml': 4.2.0
  '@vercel/og>sharp': 0.35.4

# Dependencies whose install scripts are allowed to run.
allowBuilds:
  esbuild: true
  msw: true
  # sharp is a transitive dependency of @vercel/og. Only its Node runtime uses the native
  # binary; the /api/og function runs on the edge, which uses the WASM rasterizer instead.
  sharp: false

minimumReleaseAgeExclude:
  - fast-check@4.10.0
  - vite@8.3.0

name: Release

# Publishing is a decision, not a side effect of a push: run this from the Actions tab
# ("Release" → "Run workflow", on main) when a version is ready. With changesets pending it opens
# the "Version Packages" pull request; with none, it publishes every package whose version is not
# on npm yet. The documentation site deploys separately, on Vercel, on every push to main.
on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    name: Version PR / publish
    # Only from main: a run started on another branch would publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create the "Version Packages" PR, or publish when there is nothing left to version
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
